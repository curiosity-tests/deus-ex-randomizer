name: commit
run-name: "commit ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  push:
    paths: ['src/*', 'src/BingoViewer/**', 'src/installer/**', '.github/**']

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  windows:
    if: false   # racecar: non-Linux runner, not measured here
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - uses: ./.github/run-tests

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: DXRando
          path: src/installer/dist/DXRandoInstaller.exe

      - name: Upload installer warnings
        uses: actions/upload-artifact@v4
        with:
          name: installerwarnings.txt
          path: src/installer/build/installer/warn-installer.txt

      - name: Upload Bingo Viewer
        uses: actions/upload-artifact@v4
        with:
          name: BingoViewer
          path: src/installer/dist/BingoViewer.exe

  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - run: sudo apt-get update -y
      - run: sudo apt-get install -y python3-tk idle3 binutils

      - uses: ./.github/run-tests

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: DXRando-linux
          path: src/installer/dist/DXRandoInstaller

      - name: Upload installer warnings
        uses: actions/upload-artifact@v4
        with:
          name: installerwarningslinux.txt
          path: src/installer/build/installer/warn-installer.txt

      - name: Upload Bingo Viewer
        uses: actions/upload-artifact@v4
        with:
          name: BingoViewer-linux
          path: src/installer/dist/BingoViewer
